spring.application.name=labourconnect

# Update these to match your local MySQL setup.
# Create the database first: CREATE DATABASE labourconnect;
spring.datasource.url=jdbc:mysql://localhost:3306/labourconnect?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# Auto-creates/updates tables from the entity classes - convenient for development.
# Switch to "validate" once the schema is stable and you're using migrations instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
server.port=8080

# WhatsApp Cloud API (Meta) - Stage 2A outbound messaging.
# Get phone-number-id and access-token from the Meta for Developers dashboard
# for your WhatsApp Business app. api-version is the Graph API version, e.g. v20.0.
whatsapp.api-base-url=https://graph.facebook.com
whatsapp.api-version=v20.0
whatsapp.phone-number-id=REPLACE_WITH_YOUR_PHONE_NUMBER_ID
whatsapp.access-token=REPLACE_WITH_YOUR_ACCESS_TOKEN