spring.application.name=labourconnect

# Update these to match your local MySQL setup.
# Create the database first: CREATE DATABASE labourconnect;
spring.datasource.url=jdbc:mysql://localhost:3306/labourconnect?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# Auto-creates/updates tables from the entity classes - convenient for development.
# Switch to "validate" once the schema is stable and you're using migrations instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
server.port=8080
